</style><rect width="720" height="322" rx="8" fill="var(--surface)"/><text x="24" y="34" class="title">Women fill the lowest pay band and thin out at the top</text><text x="24" y="54" class="sub">Share of women in the lowest and highest quartile pay bands (Article 9(1)(f)).</text><circle cx="155" cy="73" r="5" fill="var(--s2)"/><text x="166" y="77">Lowest band</text><circle cx="275" cy="73" r="5" fill="var(--s1)"/><text x="286" y="77">Highest band</text><line x1="150.0" y1="88" x2="150.0" y2="272" stroke="var(--grid)"/><text x="150.0" y="290" text-anchor="middle" class="muted num">20%</text><line x1="252.0" y1="88" x2="252.0" y2="272" stroke="var(--grid)"/><text x="252.0" y="290" text-anchor="middle" class="muted num">30%</text><line x1="354.0" y1="88" x2="354.0" y2="272" stroke="var(--grid)"/><text x="354.0" y="290" text-anchor="middle" class="muted num">40%</text><line x1="456.0" y1="88" x2="456.0" y2="272" stroke="var(--grid)"/><text x="456.0" y="290" text-anchor="middle" class="muted num">50%</text><line x1="558.0" y1="88" x2="558.0" y2="272" stroke="var(--grid)"/><text x="558.0" y="290" text-anchor="middle" class="muted num">60%</text><line x1="660.0" y1="88" x2="660.0" y2="272" stroke="var(--grid)"/><text x="660.0" y="290" text-anchor="middle" class="muted num">70%</text><text x="456.0" y="306" text-anchor="middle" class="muted">parity</text><text x="138" y="122.0" text-anchor="end" class="val">IT · Milan</text><line x1="267.9" y1="118.0" x2="587.4" y2="118.0" stroke="var(--axis)" stroke-width="2"/><circle cx="267.9" cy="118.0" r="6" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"><title>IT · Milan: women are 32% of the highest band</title></circle><text x="257.9" y="122.0" text-anchor="end" class="val">32%</text><circle cx="587.4" cy="118.0" r="6" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"><title>IT · Milan: women are 63% of the lowest band</title></circle><text x="597.4" y="122.0" text-anchor="start" class="val">63%</text><text x="138" y="166.0" text-anchor="end" class="val">PL · Kraków</text><line x1="313.1" y1="162.0" x2="546.0" y2="162.0" stroke="var(--axis)" stroke-width="2"/><circle cx="313.1" cy="162.0" r="6" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"><title>PL · Kraków: women are 36% of the highest band</title></circle><text x="303.1" y="166.0" text-anchor="end" class="val">36%</text><circle cx="546.0" cy="162.0" r="6" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"><title>PL · Kraków: women are 59% of the lowest band</title></circle><text x="556.0" y="166.0" text-anchor="start" class="val">59%</text><text x="138" y="210.0" text-anchor="end" class="val">DE · Munich</text><line x1="326.4" y1="206.0" x2="499.9" y2="206.0" stroke="var(--axis)" stroke-width="2"/><circle cx="326.4" cy="206.0" r="6" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"><title>DE · Munich: women are 37% of the highest band</title></circle><text x="316.4" y="210.0" text-anchor="end" class="val">37%</text><circle cx="499.9" cy="206.0" r="6" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"><title>DE · Munich: women are 54% of the lowest band</title></circle><text x="509.9" y="210.0" text-anchor="start" class="val">54%</text><text x="138" y="254.0" text-anchor="end" class="val">ES · Barcelona</text><line x1="252.8" y1="250.0" x2="620.5" y2="250.0" stroke="var(--axis)" stroke-width="2"/><circle cx="252.8" cy="250.0" r="6" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"><title>ES · Barcelona: women are 30% of the highest band</title></circle><text x="242.8" y="254.0" text-anchor="end" class="val">30%</text><circle cx="620.5" cy="250.0" r="6" fill="var(--s2)" stroke="var(--surface)" stroke-width="2"><title>ES · Barcelona: women are 66% of the lowest band</title></circle><text x="630.5" y="254.0" text-anchor="start" class="val">66%</text></svg>
