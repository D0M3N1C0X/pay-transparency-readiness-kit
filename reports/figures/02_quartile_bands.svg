<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 322" width="720" height="322" role="img" aria-label="Share of women in the lowest and highest quartile pay bands, by employer"><style>
  svg { --surface:#ffffff; --ink:#1d1d1f; --ink2:#424245; --muted:#6e6e73; --grid:#e8e8ed;
