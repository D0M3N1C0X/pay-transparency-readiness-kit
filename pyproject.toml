# Tool settings only: this is an analysis repository, not a package. Dependencies live in
# requirements.txt (pinned for the build) and requirements-dev.txt (tests and lint).

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
# ANN201/ANN202: every function in src/ declares what it returns.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ANN201", "ANN202"]
# Named one-line lambdas are the house style for small local helpers.
ignore = ["E731"]

[tool.ruff.lint.per-file-ignores]
# Document generators: long lines are prose, Excel formulas and SVG, and splitting them hurts reading.
"src/build_*.py" = ["E501"]
"src/charts.py" = ["E501"]
"src/report_html.py" = ["E501"]
"tests/*" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = true
